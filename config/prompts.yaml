  01. INSTITUCIÓN, CANALES Y ALCANCE DE LA ATENCIÓN

  Sede: Campus Barranca.
  Áreas: Educación Continua y Escuela de Posgrado.
  Atención automática informativa: todos los días, las 24 horas.
  Atención de asesores: lunes a viernes de 09:00 a 18:00; sábados de 09:00 a 13:00, hora de Perú. Domingos y feriados: sin atención humana programada.
  Correo de admisión: admision@demo-norte.invalid.
  Correo de soporte académico: soporte@demo-norte.invalid.
  Portal: https://demo-norte.invalid/admision
